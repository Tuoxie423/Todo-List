<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="登录后进入你的独立任务清单。" />
    <title>一间清单</title>
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <main class="home-shell">
      <section class="entry-panel" aria-labelledby="home-title">
        <div class="entry-copy">
          <p class="eyebrow">一间清单</p>
          <h1 id="home-title">登录你的任务工作台</h1>
          <p class="lead">输入账号和密码即可进入。首次使用会自动注册，已有账号会在校验密码后登录。</p>
          <div class="trust-row" aria-label="产品能力">
            <span>用户隔离</span>
            <span>历史清单</span>
            <span>同一套 Gin API</span>
          </div>
        </div>

        <div class="entry-stack">
          <form class="auth-form" id="authForm">
            <div class="form-heading">
              <p class="eyebrow">Account</p>
              <h2>账号登录</h2>
            </div>
            <label class="entry-field">
              <span>用户名</span>
              <input id="username" name="username" type="text" maxlength="40" placeholder="例如：alice" autocomplete="username" required />
            </label>
            <label class="entry-field">
              <span>密码</span>
              <input id="password" name="password" type="password" minlength="6" placeholder="至少 6 位" autocomplete="current-password" required />
            </label>
            <button class="enter-button" type="submit">登录 / 自动注册</button>
            <p class="room-message" id="authMessage" role="status"></p>

            <section class="history-panel" aria-labelledby="account-history-title">
              <div class="history-heading">
                <h2 id="account-history-title">登录历史</h2>
                <button class="clear-history" id="clearAccountHistoryButton" type="button">清空</button>
              </div>
              <div class="history-list" id="accountHistoryList"></div>
            </section>
          </form>

          <section class="signed-panel" id="signedPanel" hidden>
            <div>
              <span>当前用户</span>
              <strong id="currentUsername">-</strong>
            </div>
            <button class="clear-history" id="logoutButton" type="button">退出</button>
          </section>

          <form class="room-form" id="roomForm" hidden>
            <div class="form-heading">
              <p class="eyebrow">List</p>
              <h2>查看清单</h2>
            </div>
            <label class="entry-field">
              <span>清单名称</span>
              <input id="roomName" name="name" type="text" maxlength="40" placeholder="例如：Go 后端练习" autocomplete="off" required />
            </label>
            <button class="enter-button" type="submit">查看清单</button>
            <p class="room-message" id="roomMessage" role="status"></p>

            <section class="history-panel" aria-labelledby="history-title">
              <div class="history-heading">
                <h2 id="history-title">历史清单</h2>
                <button class="clear-history" id="clearHistoryButton" type="button">清空</button>
              </div>
              <div class="history-list" id="historyList"></div>
            </section>
          </form>
        </div>
      </section>

      <section class="hint-strip" aria-label="项目能力">
        <div>
          <strong>用户隔离</strong>
          <span>每个用户的本地清单记录独立保存。</span>
        </div>
        <div>
          <strong>密码加密</strong>
          <span>后端使用 bcrypt 保存密码哈希。</span>
        </div>
        <div>
          <strong>自动注册</strong>
          <span>新账号首次登录时会自动创建。</span>
        </div>
      </section>
    </main>

    <script src="./common/storage.js"></script>
    <script src="./common/dom.js"></script>
    <script src="./common/api.js"></script>
    <script src="./home.js"></script>
  </body>
</html>
